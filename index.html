<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classical Radar</title>
<style>
:root {
  --bg:#f7f7f5; --card:#ffffff; --fg:#1c1c1a; --muted:#6a6a64; --faint:#9a9a93; --line:#e5e4df; --hover:#f1f1ee;
  --good:#127a47; --good-bg:#e3f3ea; --warn:#a25b00; --warn-bg:#fdf0dc; --bad:#b42330; --bad-bg:#fbe7e8; --accent:#2457c5; --accent-bg:#e6edfb;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg:#141413; --card:#1c1c1a; --fg:#ecebe6; --muted:#a3a39b; --faint:#75756e; --line:#2f2f2c; --hover:#252523;
  --good:#4cc38a; --good-bg:#183527; --warn:#f0b35c; --warn-bg:#3a2a12; --bad:#f0717a; --bad-bg:#3d1c1f; --accent:#7aa5f5; --accent-bg:#1d2a45;
  color-scheme: dark;
} }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-text-size-adjust:100%; }
main { max-width:1120px; margin:0 auto; padding:16px 16px 64px; }
h1 { font-size:22px; margin:0; letter-spacing:-.01em; }
h2 { font-size:16px; margin:0; }
h3 { font-size:14px; margin:0 0 6px; }
a { color:var(--accent); }
.muted { color:var(--muted); } .faint { color:var(--faint); } .small { font-size:13px; }
button, select, input { font:inherit; color:var(--fg); }
button { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer; }
button:hover { background:var(--hover); }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
select, input[type=date], input[type=number], input[type=search] { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:5px 8px; }
input[type=search] { min-width:200px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-top:16px; }
.card-head { display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:10px; }
.empty { color:var(--muted); font-size:14px; padding:4px 0; }

header { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
#status { margin:4px 0 0; font-size:13px; }
nav { display:flex; gap:4px; flex-wrap:wrap; margin-top:12px; border-bottom:1px solid var(--line); }
nav a { text-decoration:none; color:var(--muted); padding:8px 12px; border-bottom:2px solid transparent; margin-bottom:-1px; font-size:14px; }
nav a.on { color:var(--fg); border-bottom-color:var(--fg); font-weight:600; }

.list { list-style:none; margin:0; padding:0; display:grid; gap:6px; }
.ev { display:grid; grid-template-columns:64px 1fr auto; gap:12px; align-items:center; padding:8px 10px; border:1px solid var(--line); border-radius:10px; cursor:pointer; background:var(--card); }
.ev:hover { background:var(--hover); }
.date { text-align:center; line-height:1.1; }
.date .m { font-size:11px; text-transform:uppercase; color:var(--muted); letter-spacing:.04em; }
.date .d { font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; }
.date .w { font-size:11px; color:var(--faint); }
.ev .what { min-width:0; }
.ev .what b { display:block; font-size:14px; overflow-wrap:anywhere; }
.ev .what span { font-size:12px; color:var(--muted); }
.ev .side { display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
.score { font-weight:700; font-size:13px; font-variant-numeric:tabular-nums; border-radius:6px; padding:2px 7px; background:var(--accent-bg); color:var(--accent); }
.tags { display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
.tag { font-size:11px; border-radius:4px; padding:1px 6px; border:1px solid var(--line); color:var(--muted); white-space:nowrap; }
.tag.free { background:var(--good-bg); color:var(--good); border-color:transparent; }
.tag.piano { background:var(--accent-bg); color:var(--accent); border-color:transparent; }
.tag.new { background:var(--warn-bg); color:var(--warn); border-color:transparent; }
.tag.v-Verified { color:var(--good); } .tag.v-Unverified { color:var(--warn); } .tag.v-Cancelled { color:var(--bad); }

.grid2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:0 16px; }
.filters { position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(6px);
  display:flex; gap:8px 14px; flex-wrap:wrap; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); font-size:13px; }
.filters label { display:flex; gap:6px; align-items:center; color:var(--muted); }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
.seg button { border:none; border-radius:0; padding:5px 10px; font-size:13px; }
.seg button + button { border-left:1px solid var(--line); }
.seg button.on { background:var(--fg); color:var(--bg); }
.count { font-size:13px; color:var(--muted); margin:10px 0 6px; }

.cal { display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); border-top:1px solid var(--line); border-left:1px solid var(--line); }
.cal > div { border-right:1px solid var(--line); border-bottom:1px solid var(--line); min-height:92px; padding:4px; font-size:12px; overflow:hidden; }
.cal .hd { min-height:0; text-align:center; color:var(--muted); font-weight:600; background:var(--card); }
.cal .day { background:var(--card); }
.cal .day.out { background:transparent; color:var(--faint); }
.cal .day.today { outline:2px solid var(--accent); outline-offset:-2px; }
.cal .n { font-weight:600; font-size:12px; color:var(--muted); }
.cal .it { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border-radius:4px; padding:1px 4px; margin-top:2px; cursor:pointer; background:var(--hover); }
.cal .it.free { background:var(--good-bg); }
.cal .it.hi { font-weight:600; }

.table-wrap { overflow-x:auto; margin:0 -16px; padding:0 16px; }
table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; font-size:13px; }
th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
th { font-size:12px; color:var(--muted); font-weight:600; white-space:nowrap; }
th.sortable { cursor:pointer; user-select:none; } th.sortable:hover { color:var(--fg); }
tr.click { cursor:pointer; } tr.click:hover td { background:var(--hover); }
.ok { color:var(--good); } .bad { color:var(--bad); } .warn { color:var(--warn); }

dialog { border:none; border-radius:14px; padding:0; width:min(760px, calc(100vw - 24px)); max-height:calc(100vh - 24px); background:var(--card); color:var(--fg); box-shadow:0 20px 60px rgba(0,0,0,.3); }
dialog::backdrop { background:rgba(0,0,0,.45); }
.dlg-head { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; padding:16px 18px 0; }
.dlg-head h2 { font-size:18px; }
.dlg-body { padding:10px 18px 18px; }
dl.kv { display:grid; grid-template-columns:130px 1fr; gap:6px 12px; margin:10px 0; font-size:14px; }
dl.kv dt { color:var(--muted); } dl.kv dd { margin:0; overflow-wrap:anywhere; }
.notes { font-size:12px; color:var(--muted); }
.editor { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:10px; margin:10px 0; }
.editor label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); }
pre { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px; font-size:12px; overflow:auto; max-height:240px; }
.steps { font-size:13px; color:var(--muted); padding-left:18px; }
@media (max-width:640px) {
  .ev { grid-template-columns:52px 1fr; }
  .ev .side { grid-column:2; flex-direction:row; align-items:center; justify-content:flex-start; }
  .tags { justify-content:flex-start; }
  .cal > div { min-height:64px; font-size:10px; }
  dl.kv { grid-template-columns:1fr; } dl.kv dt { margin-top:6px; }
}
</style>
</head>

  const showRun = (r) => detail.replaceChildren(section(`Run ${r.run_id}`, `${r.status} · ${fmtWhen(r.started_at)} → ${fmtWhen(r.finished_at)}`,
    el("div", { class: "table-wrap" }, el("table", {},
      el("thead", {}, el("tr", {}, ["Source", "Status", "How", "Found", "Kept", "Rejected", "Model pages", "Cost", "Time"].map((h) => el("th", {}, h)))),
      el("tbody", {}, r.sources.map((s) => el("tr", {},
        el("td", {}, srcById.get(s.id)?.name || s.id), el("td", { class: s.status === "ok" ? "ok" : "bad" }, s.status === "ok" ? "ok" : `failed: ${s.error || ""}`),
        el("td", {}, s.method), el("td", {}, s.candidates), el("td", {}, s.accepted),
        el("td", {}, Object.entries(s.rejected).map(([k, v]) => `${k} ×${v}`).join(", ") || "–"),
        el("td", {}, s.pages ? `${s.model_pages}/${s.pages} read` : "–"), el("td", {}, s.cost_usd ? `$${s.cost_usd.toFixed(4)}` : "–"), el("td", {}, `${(s.ms / 1000).toFixed(1)}s`))))))));
  view.append(
    section("Last 30 days", null, el("p", { class: "small" }, `${month.length} runs · model cost $${cost.toFixed(4)} · ${tok[0].toLocaleString()} input / ${tok[1].toLocaleString()} output tokens`)),
    section("Runs", "click a run for per-source details", runs.length ? el("div", { class: "table-wrap" }, el("table", {},
      el("thead", {}, el("tr", {}, ["When", "Status", "Sources", "Events", "New", "Email-worthy", "New rows", "Cost"].map((h) => el("th", {}, h)))),
      el("tbody", {}, runs.map((r) => {
        const failed = r.sources.filter((s) => s.status === "failed").length;
        return el("tr", { class: "click", onclick: () => showRun(r) },
          el("td", {}, fmtWhen(r.started_at)), el("td", { class: r.status === "ok" ? "ok" : r.status === "partial" ? "warn" : "bad" }, r.status),
          el("td", {}, `${r.sources.length - failed}/${r.sources.length}`), el("td", {}, r.counts.events), el("td", {}, r.counts.new_events),
          el("td", {}, r.counts.eligible), el("td", { title: "full sightings / seen-again rows" }, `${r.counts.sightings_full} / ${r.counts.sightings_seen}`), el("td", {}, `$${r.cost_usd.toFixed(4)}`));
      })))) : el("p", { class: "empty" }, "No runs yet.")),
    detail);
  if (runs[0]) showRun(runs[0]);
}

// --- settings editor ----------------------------------------------------------------------
function renderSettings(view) {
  const s = JSON.parse(JSON.stringify(D.settings));
  const num = (label, get, set, step = 1) => el("label", {}, label, el("input", { type: "number", step, value: get(), oninput: (ev) => { set(Number(ev.target.value)); preview(); } }));
  const out = el("pre");
  const preview = () => { out.textContent = JSON.stringify(s, null, 2); };
  const w = s.scoring.relevance;
  view.append(section("Settings", "changes are saved by committing config/settings.json on GitHub",
    el("div", {},
      el("p", { class: "small muted" }, `Center: ${s.center.label} (a city point, never a home address). This page is public and can't save on its own: “Copy and open GitHub” copies the new file and opens GitHub's editor, where you paste it and commit. The next daily run uses it.`),
      el("h3", {}, "Area and email"),
      el("div", { class: "editor" },
        num("Radius (miles)", () => s.radius_mi, (v) => (s.radius_mi = v)),
        num("Email: minimum relevance", () => s.scoring.notify.min_relevance, (v) => (s.scoring.notify.min_relevance = v)),
        num("Email: minimum confidence", () => s.scoring.notify.min_confidence, (v) => (s.scoring.notify.min_confidence = v)),
        num("Paid budget per person ($)", () => s.scoring.paid_budget_usd, (v) => (s.scoring.paid_budget_usd = v))),
      el("h3", {}, "Relevance points"),
      el("div", { class: "editor" },
        num("Piano", () => w.piano, (v) => (w.piano = v)), num("Piano mentioned", () => w.piano_mentioned, (v) => (w.piano_mentioned = v)),
        num("Free", () => w.free, (v) => (w.free = v)), num("Paid within budget", () => w.paid_within_budget, (v) => (w.paid_within_budget = v)),
        num("Educational", () => w.educational, (v) => (w.educational = v)), num("Proximity (max)", () => w.proximity, (v) => (w.proximity = v)),
        num("Within 60 days", () => w.date_soon, (v) => (w.date_soon = v))),
      el("button", { class: "primary", onclick: async () => {
        let copied = false;
        try { await navigator.clipboard.writeText(JSON.stringify(s, null, 2) + "\n"); copied = true; } catch {}
        window.open(D.links.editSettings, "_blank", "noopener");
        if (!copied) alert("Copy the JSON below, then paste it in GitHub's editor.");
      } }, "Copy and open GitHub"),
      el("ol", { class: "steps" }, el("li", {}, "In GitHub's editor, select all and paste."), el("li", {}, "Commit to main.")),
      out)));
  preview();
}

renderStatus();
route();
</script>
</body>
